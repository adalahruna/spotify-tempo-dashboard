<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi Lagu Pintar - Spotify Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #999;
            transition: all 0.3s;
        }
        
        .step.active {
            background: #667eea;
            color: white;
            transform: scale(1.2);
        }
        
        .step.completed {
            background: #4caf50;
            color: white;
        }
        
        .question {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .question h2 {
            font-size: 2em;
            color: #333;
            margin-bottom: 15px;
        }
        
        .question p {
            font-size: 1.1em;
            color: #666;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .option-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }
        
        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .option-card.selected {
            border-color: #4caf50;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
        }
        
        .option-card .emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .option-card .label {
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }
        
        .option-card .desc {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .results {
            display: none;
        }
        
        .results.active {
            display: block;
        }
        
        .results-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .results-header h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .results-summary {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .results-summary p {
            color: #666;
            margin-bottom: 10px;
        }
        
        .track-list {
            display: grid;
            gap: 15px;
        }
        
        .track-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }
        
        .track-card:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }
        
        .track-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
        }
        
        .track-info {
            flex: 1;
        }
        
        .track-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .track-artist {
            color: #666;
            font-size: 0.9em;
        }
        
        .track-features {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .feature-badge {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }
        
        .track-match {
            text-align: right;
        }
        
        .match-score {
            font-size: 1.2em;
            font-weight: bold;
            color: #4caf50;
        }
        
        .match-desc {
            font-size: 0.9em;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Rekomendasi Lagu Pintar</h1>
            <p>Temukan lagu yang sempurna untuk moodmu!</p>
        </div>
        
        <div class="card">
            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step active" id="step1">1</div>
                <div class="step" id="step2">2</div>
            </div>
            
            <!-- Step 1: Select Mood -->
            <div id="stepMood" class="step-content">
                <div class="question">
                    <h2>Lagi pengen dengerin lagu buat apa nih?</h2>
                    <p>Pilih mood atau aktivitasmu</p>
                </div>
                
                <div class="options" id="moodOptions">
                    <!-- Will be populated by JavaScript -->
                </div>
                
                <div class="navigation">
                    <div></div>
                    <button class="btn btn-primary" id="btnNextMood" disabled>Lanjut →</button>
                </div>
            </div>
            
            <!-- Step 2: Select Activity -->
            <div id="stepActivity" class="step-content hidden">
                <div class="question">
                    <h2 id="activityQuestion">Loading...</h2>
                </div>
                
                <div class="options" id="activityOptions">
                    <!-- Will be populated by JavaScript -->
                </div>
                
                <div class="navigation">
                    <button class="btn btn-secondary" id="btnBack">← Kembali</button>
                    <button class="btn btn-primary" id="btnGetRecommendations" disabled>Cari Lagu! 🎵</button>
                </div>
            </div>
            
            <!-- Results -->
            <div id="stepResults" class="results">
                <div class="results-header">
                    <h2>🎉 Playlist Sempurna Untukmu!</h2>
                </div>
                
                <div class="results-summary" id="resultsSummary">
                    <!-- Will be populated by JavaScript -->
                </div>
                
                <div class="track-list" id="trackList">
                    <!-- Will be populated by JavaScript -->
                </div>
                
                <div class="navigation" style="margin-top: 30px;">
                    <button class="btn btn-secondary" id="btnRestart">🔄 Cari Lagi</button>
                    <div></div>
                </div>
            </div>
            
            <!-- Loading -->
            <div id="loadingState" class="loading hidden">
                <div class="spinner"></div>
                <p>Mencari lagu yang sempurna untukmu...</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // State
        let selectedMood = null;
        let selectedActivity = null;
        let moods = [];
        
        // Load moods on page load
        async function loadMoods() {
            try {
                const response = await fetch(`${API_URL}/moods`);
                const data = await response.json();
                
                if (data.success) {
                    moods = data.moods;
                    renderMoodOptions();
                }
            } catch (error) {
                console.error('Error loading moods:', error);
                alert('Gagal memuat data. Pastikan API server berjalan!');
            }
        }
        
        function renderMoodOptions() {
            const container = document.getElementById('moodOptions');
            container.innerHTML = '';
            
            moods.forEach(mood => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = `
                    <div class="emoji">${mood.emoji}</div>
                    <div class="label">${mood.label}</div>
                `;
                
                card.onclick = () => selectMood(mood.id, card);
                container.appendChild(card);
            });
        }
        
        function selectMood(moodId, element) {
            // Remove previous selection
            document.querySelectorAll('#moodOptions .option-card').forEach(el => {
                el.classList.remove('selected');
            });
            
            // Select new
            element.classList.add('selected');
            selectedMood = moodId;
            document.getElementById('btnNextMood').disabled = false;
        }
        
        function goToActivityStep() {
            // Update steps
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step1').classList.add('completed');
            document.getElementById('step2').classList.add('active');
            
            // Show activity step
            document.getElementById('stepMood').classList.add('hidden');
            document.getElementById('stepActivity').classList.remove('hidden');
            
            // Render activities
            const mood = moods.find(m => m.id === selectedMood);
            document.getElementById('activityQuestion').textContent = getActivityQuestion(selectedMood);
            renderActivityOptions(mood.activities);
        }
        
        function getActivityQuestion(moodId) {
            const questions = {
                'olahraga': 'Olahraga apa nih?',
                'belajar': 'Butuh konsentrasi atau musik latar aja?',
                'senang': 'Mau ngapain?',
                'galau': 'Butuh curhat atau pelan-pelan aja?',
                'santai': 'Mau santai atau beneran tidur?',
                'pesta': 'Suasananya gimana?',
                'nyetir': 'Mau kemana?',
                'romantis': 'Suasana romantis yang gimana?'
            };
            return questions[moodId] || 'Pilih preferensimu:';
        }
        
        function renderActivityOptions(activities) {
            const container = document.getElementById('activityOptions');
            container.innerHTML = '';
            
            activities.forEach(activity => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = `
                    <div class="label">${formatActivityLabel(activity.id)}</div>
                    <div class="desc">${activity.description}</div>
                `;
                
                card.onclick = () => selectActivity(activity.id, card);
                container.appendChild(card);
            });
        }
        
        function formatActivityLabel(activityId) {
            const labels = {
                'joget': '💃 Joget/Goyang',
                'nyanyi': '🎤 Nyanyi',
                'santai': '😌 Santai Aja',
                'pagi_cerah': '🌞 Pagi Cerah',
                'lari_cardio': '🏃 Lari/Cardio',
                'gym_beban': '🏋️ Gym/Beban',
                'yoga': '🧘 Yoga/Stretch',
                'sepeda': '🚴 Sepeda',
                'fokus_maksimal': '🎧 Fokus Maksimal',
                'musik_latar': '🎵 Musik Latar',
                'santai_kerja': '☕ Santai Kerja',
                'nangis_curhat': '😭 Nangis Curhat',
                'melow_merenung': '🎹 Melow Merenung',
                'hujan': '🌧️ Hujan-hujan',
                'tidur': '😴 Tidur',
                'meditasi': '🧘 Meditasi',
                'baca_buku': '📖 Baca Buku',
                'ngopi': '☕ Ngopi Santai',
                'dance_party': '🕺 Dance Party',
                'hype_party': '🎊 Hype Party',
                'santai_nongkrong': '🍹 Santai Nongkrong',
                'preparty': '🎶 Pre-Party',
                'jalan_tol': '🛣️ Jalan Tol',
                'macet': '🏙️ Macet di Kota',
                'malam': '🌃 Malam Hari',
                'roadtrip': '🏞️ Road Trip',
                'intimate': '🕯️ Intimate',
                'kencan': '💑 Kencan',
                'slow_dance': '💃 Slow Dance',
                'love_songs': '💕 Love Songs'
            };
            return labels[activityId] || activityId;
        }
        
        function selectActivity(activityId, element) {
            // Remove previous selection
            document.querySelectorAll('#activityOptions .option-card').forEach(el => {
                el.classList.remove('selected');
            });
            
            // Select new
            element.classList.add('selected');
            selectedActivity = activityId;
            document.getElementById('btnGetRecommendations').disabled = false;
        }
        
        async function getRecommendations() {
            // Show loading
            document.getElementById('stepActivity').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            
            try {
                const response = await fetch(`${API_URL}/recommend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mood: selectedMood,
                        activity: selectedActivity,
                        limit: 20
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data);
                } else {
                    alert('Error: ' + data.error);
                    goBack();
                }
            } catch (error) {
                console.error('Error getting recommendations:', error);
                alert('Gagal mendapatkan rekomendasi. Pastikan API server berjalan!');
                goBack();
            }
        }
        
        function displayResults(data) {
            // Hide loading
            document.getElementById('loadingState').classList.add('hidden');
            
            // Update steps
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step2').classList.add('completed');
            
            // Show results
            document.getElementById('stepResults').classList.add('active');
            
            // Render summary
            const mood = moods.find(m => m.id === data.mood);
            const summaryHTML = `
                <p><strong>✨ Berdasarkan pilihan kamu:</strong></p>
                <p>• ${mood.emoji} ${mood.label}</p>
                <p>• ${data.description}</p>
                <p><strong>📊 Ditemukan ${data.count} lagu</strong></p>
            `;
            document.getElementById('resultsSummary').innerHTML = summaryHTML;
            
            // Render tracks
            const trackList = document.getElementById('trackList');
            trackList.innerHTML = '';
            
            data.results.forEach((track, index) => {
                const card = document.createElement('div');
                card.className = 'track-card';
                
                // Format artists
                let artists = track.artists;
                if (Array.isArray(artists)) {
                    artists = artists.join(', ');
                }
                
                card.innerHTML = `
                    <div class="track-number">${index + 1}</div>
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-artist">${artists} • ${track.year || 'Unknown'}</div>
                        <div class="track-features">
                            <span class="feature-badge">${Math.round(track.tempo)} BPM</span>
                            ${track.match_description ? `<span class="feature-badge">${track.match_description}</span>` : ''}
                        </div>
                    </div>
                    <div class="track-match">
                        <div class="match-score">${Math.round(track.match_score * 100)}%</div>
                        <div class="match-desc">Match</div>
                    </div>
                `;
                
                trackList.appendChild(card);
            });
        }
        
        function goBack() {
            // Update steps
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.remove('completed');
            document.getElementById('step1').classList.add('active');
            
            // Show mood step
            document.getElementById('stepActivity').classList.add('hidden');
            document.getElementById('stepMood').classList.remove('hidden');
            
            // Reset activity selection
            selectedActivity = null;
            document.getElementById('btnGetRecommendations').disabled = true;
        }
        
        function restart() {
            // Reset state
            selectedMood = null;
            selectedActivity = null;
            
            // Reset steps
            document.getElementById('step1').classList.add('active');
            document.getElementById('step1').classList.remove('completed');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step2').classList.remove('completed');
            
            // Show mood step
            document.getElementById('stepResults').classList.remove('active');
            document.getElementById('stepMood').classList.remove('hidden');
            document.getElementById('btnNextMood').disabled = true;
            
            // Clear selections
            document.querySelectorAll('.option-card').forEach(el => {
                el.classList.remove('selected');
            });
        }
        
        // Event listeners
        document.getElementById('btnNextMood').onclick = goToActivityStep;
        document.getElementById('btnBack').onclick = goBack;
        document.getElementById('btnGetRecommendations').onclick = getRecommendations;
        document.getElementById('btnRestart').onclick = restart;
        
        // Initialize
        loadMoods();
    </script>
</body>
</html>
